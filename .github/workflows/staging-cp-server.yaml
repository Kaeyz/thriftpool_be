name: Staging Community Server Deploy Workflow

on:
  push:
    branches:
      - staging
    paths:
      - '*'
      - 'packages/**'
      - 'apps/community/**'
      - '.github/workflows/staging-cp-server.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies for cp-service
        run: pnpm cp install --frozen-lockfile

      - name: Run Lint
        run: pnpm cp lint

      - name: Install Railway CLI
        shell: bash
        run: |
          curl -fsSL https://railway.app/install.sh | bash
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway
        run: railway up --service cp-server-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

      - name: Set env on Railway
        run: |
          variables=(
            "APP_ENV=test"
            "DEBUG_MODE=true"
            "HOST=https://staging-cp-api.up.railway.app"
            "WEB_APP_BASE_URL=https://staging-cp-fe.up.railway.app"
            "MONGO_URI=${{ secrets.MONGO_URI_STAGING }}"
            "REDIS_URL=${{ secrets.REDIS_URL_STAGING }}"
            "SERVER_USERNAME=${{ secrets.SERVER_USERNAME_STAGING }}"
            "SERVER_PASSWORD=${{ secrets.SERVER_PASSWORD_STAGING }}"
            "SECRET_KEY=${{ secrets.SECRET_KEY_STAGING }}"
            "DISCORD_KEY=${{ secrets.DISCORD_KEY }}"
            "DISCORD_GUILD_NAME=${{ secrets.DISCORD_GUILD_NAME }}"
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            "RESEND_FROM=${{ secrets.RESEND_FROM }}"
            "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
          )
          
          SET_FLAGS=""
          for var in "${variables[@]}"; do
            SET_FLAGS+="--set \"$var\" "
          done

          eval "railway variables --service cp-server-staging $SET_FLAGS"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
